spring:
  application:
    name: ms-pedidos360-notify
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:pedidos360}
    password: ${RABBITMQ_PASS:pedidos360}
    connection-timeout: 3s
    listener:
      simple:
        acknowledge-mode: manual        # ACK/NACK explícito en cada consumidor
        prefetch: 10
        default-requeue-rejected: false # un rechazo nunca vuelve a la cola por defecto: va a la DLQ

# Mismos nombres que en orders
app:
  rabbit:
    exchanges:
      direct: cmd.direct
      topic: cmd.topic
      dead-letter: cmd.dead.dlx
    email:
      queue: q.cmd.email
      dlq: q.cmd.email.dlq
      routing-key: email.send
      topic-pattern: "email.#"
    kitchen:
      queue: q.cmd.kitchen
      dlq: q.cmd.kitchen.dlq
      routing-key: kitchen.ticket
      topic-pattern: "kitchen.#"
    invoice:
      queue: q.cmd.invoice
      dlq: q.cmd.invoice.dlq
      routing-key: invoice.gen
      topic-pattern: "invoice.#"

logging:
  level:
    cl.duocuc.pedidos360.notify: INFO