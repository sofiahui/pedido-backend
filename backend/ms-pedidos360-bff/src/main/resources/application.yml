server:
  port: 8080

spring:
  application:
    name: ms-pedidos360-bff

azure:
  tenant-id: ${AZURE_TENANT_ID:CHANGE_ME_TENANT_ID}
  audience: ${AZURE_API_AUDIENCE:api://CHANGE_ME_API_CLIENT_ID}
  roles-claim: ${AZURE_ROLES_CLAIM:roles}

downstream:
  orders:
    base-url: ${ORDERS_SERVICE_URL:http://localhost:8081}
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: INFO
