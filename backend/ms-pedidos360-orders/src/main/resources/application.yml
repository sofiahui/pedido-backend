server:
  port: 8081

spring:
  application:
    name: ms-pedidos360-orders
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pedidos360_orders}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8
    username: ${DB_USER:pedidos360}
    password: ${DB_PASSWORD:pedidos360}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:pedidos360}
    password: ${RABBITMQ_PASS:pedidos360}
    connection-timeout: 3s

azure:
  tenant-id: ${AZURE_TENANT_ID:391785ea-8a93-4b03-aa6f-34f76498a5ad}
  audience: ${AZURE_API_AUDIENCE:9f968a39-1844-4166-ada1-5833116eda90}
  roles-claim: ${AZURE_ROLES_CLAIM:roles}

downstream:
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}

app:
  rabbit:
    exchanges:
      direct: cmd.direct
      topic: cmd.topic
      dead-letter: cmd.dead.dlx
    email:
      queue: q.cmd.email
      dlq: q.cmd.email.dlq
      routing-key: email.send
      topic-pattern: "email.#"
    kitchen:
      queue: q.cmd.kitchen
      dlq: q.cmd.kitchen.dlq
      routing-key: kitchen.ticket
      topic-pattern: "kitchen.#"
    invoice:
      queue: q.cmd.invoice
      dlq: q.cmd.invoice.dlq
      routing-key: invoice.gen
      topic-pattern: "invoice.#"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: INFO