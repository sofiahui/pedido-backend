services:
  mysql:
    image: mysql:8.4
    container_name: pedidos360-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pedidos360_root}
      MYSQL_USER: ${MYSQL_APP_USER:-pedidos360}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-pedidos360}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-pedidos360_root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:5
    container_name: pedidos360-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pedidos360_root}
    ports:
      - "8090:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
