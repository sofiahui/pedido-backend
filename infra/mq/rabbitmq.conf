# Configuración compartida por rabbit1 y rabbit2: formación automática del clúster.
# Al arrancar, cada nodo busca a los demás en la lista y se une al clúster
# (equivale a ejecutar "rabbitmqctl join_cluster rabbit@rabbit1" en rabbit2).
cluster_name = pedidos360

cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2
